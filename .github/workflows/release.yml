name: Release Multiplataforma (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag de version para publicar en GitHub Releases (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  verificar-compuertas:
    name: Compuertas de Calidad (Frontend + Rust)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias nativas de Linux (GTK3 / WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Verificar integridad de tauri.conf.json y gobernanza
        run: |
          node scripts/verificar-tauri-conf.mjs
          npm run test:gobernanza

      - name: Instalar dependencias y verificar Frontend (Atomic UI + Vitest + Build)
        working-directory: frontend
        run: |
          npm ci
          if [ -d "../../-Atomic-UI" ]; then
            npm run check:atomic:pin
          else
            echo "Checkout aislado en CI: se omite check:atomic:pin (requiere clon hermano ../../-Atomic-UI)"
          fi
          npm run check:types
          npm run check:angular
          npm run check:theme
          npm run check:css
          npm test -- --watch=false
          npm run build

      - name: Ejecutar pruebas unitarias de Backend Rust
        working-directory: src-tauri
        run: cargo test

  publicar-release:
    name: Compilar y Publicar (${{ matrix.etiqueta }})
    needs: verificar-compuertas
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            etiqueta: windows-x86_64
            args: ''
            binario_origen: src-tauri/target/release/union-pdf.exe
            binario_publico: union-pdf-windows-x86_64.exe
          - os: ubuntu-22.04
            etiqueta: linux-x86_64
            args: ''
            binario_origen: src-tauri/target/release/union-pdf
            binario_publico: union-pdf-linux-x86_64.tar.gz
          - os: macos-latest
            etiqueta: macos-aarch64
            args: '--target aarch64-apple-darwin'
            binario_origen: src-tauri/target/aarch64-apple-darwin/release/union-pdf
            binario_publico: union-pdf-macos-arm64.app.tar.gz
          - os: macos-latest
            etiqueta: macos-x86_64
            args: '--target x86_64-apple-darwin'
            binario_origen: src-tauri/target/x86_64-apple-darwin/release/union-pdf
            binario_publico: union-pdf-macos-x86_64.app.tar.gz

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema en Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Instalar dependencias de Frontend y compilar dist/
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compilar binario nativo Release (Cargo + Tauri v1.5)
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml ${{ matrix.args }}

      - name: Empaquetar artefacto por plataforma (.exe, .app.tar.gz, .tar.gz) con checksum SHA-256
        shell: bash
        run: |
          mkdir -p release-portables
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "${{ matrix.binario_origen }}" "release-portables/${{ matrix.binario_publico }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            APP_DIR="build-bundle/union-pdf.app"
            rm -rf build-bundle
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
            cp "${{ matrix.binario_origen }}" "$APP_DIR/Contents/MacOS/union-pdf"
            chmod 755 "$APP_DIR/Contents/MacOS/union-pdf"
            cp "src-tauri/icons/icon.icns" "$APP_DIR/Contents/Resources/icon.icns"
            printf 'APPL????' > "$APP_DIR/Contents/PkgInfo"
            node -e '
              const fs = require("fs");
              const pkg = require("./src-tauri/tauri.conf.json").package;
              const plist = [
                "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
                "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">",
                "<plist version=\"1.0\">",
                "<dict>",
                "  <key>CFBundleDevelopmentRegion</key>",
                "  <string>es</string>",
                "  <key>CFBundleDisplayName</key>",
                "  <string>Unión PDF</string>",
                "  <key>CFBundleExecutable</key>",
                "  <string>union-pdf</string>",
                "  <key>CFBundleIconFile</key>",
                "  <string>icon.icns</string>",
                "  <key>CFBundleIdentifier</key>",
                "  <string>com.archware.union-pdf</string>",
                "  <key>CFBundleInfoDictionaryVersion</key>",
                "  <string>6.0</string>",
                "  <key>CFBundleName</key>",
                "  <string>union-pdf</string>",
                "  <key>CFBundlePackageType</key>",
                "  <string>APPL</string>",
                "  <key>CFBundleShortVersionString</key>",
                "  <string>" + pkg.version + "</string>",
                "  <key>CFBundleVersion</key>",
                "  <string>" + pkg.version + "</string>",
                "  <key>LSMinimumSystemVersion</key>",
                "  <string>10.13</string>",
                "  <key>NSHighResolutionCapable</key>",
                "  <true/>",
                "</dict>",
                "</plist>",
                ""
              ].join("\n");
              fs.writeFileSync("build-bundle/union-pdf.app/Contents/Info.plist", plist, "utf8");
            '
            plutil -lint "$APP_DIR/Contents/Info.plist"
            codesign --force --deep --sign - "$APP_DIR"
            COPYFILE_DISABLE=1 tar -C build-bundle -czf "release-portables/${{ matrix.binario_publico }}" union-pdf.app
          else
            rm -rf build-bundle
            mkdir -p build-bundle
            cp "${{ matrix.binario_origen }}" "build-bundle/payload"
            cp "scripts/linux-launcher.c" "build-bundle/launcher.c"
            (
              cd build-bundle
              ld -r -b binary -o payload.o payload
              objcopy --rename-section .data=.rodata,alloc,load,readonly,data,contents payload.o payload.o
              gcc -Wall -Wextra -O2 -no-pie -Wl,-z,noexecstack -o union-pdf launcher.c payload.o
              strip --strip-unneeded union-pdf
              rm -f payload payload.o launcher.c
            )
            chmod 755 "build-bundle/union-pdf"
            readelf -h "build-bundle/union-pdf" | grep -E "Type:[[:space:]]+EXEC"
            tar -C build-bundle -czf "release-portables/${{ matrix.binario_publico }}" union-pdf
          fi
          cd release-portables
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.binario_publico }}" > "${{ matrix.binario_publico }}.sha256"
          else
            shasum -a 256 "${{ matrix.binario_publico }}" > "${{ matrix.binario_publico }}.sha256"
          fi

      - name: Publicar artefactos multiplataforma en GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_version || 'v1.0.0' }}
          name: "Unión PDF ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_version || 'v1.0.0' }}"
          body: |
            ## Unión PDF — Lanzamiento Corporativo Multiplataforma (`COTAHA · @archware · SSIT Consulting`)

            Aplicación corporativa de escritorio diseñada para demostrar que la integración entre el ecosistema propio de Backend (**Artifact Mangosta** — DDD, Arquitectura Hexagonal, CQRS estricto y frontera IPC determinista `DesktopFacadeService` + `RespuestaSistemaV1<T>`) y el ecosistema propio de Frontend (**Artifact Barracuda** + **Atomic UI `@atomic-ui/core v5.22.0`** sobre Angular 22 + Signals) genera software nativo de calidad empresarial, 100% en memoria local y auditado por compuertas deterministas.

            ### ✨ Novedades destacadas en `v1.0.0` (Cierre de Edición Corporativa)
            - **Guardado nativo real («Guardar como…») por IPC Rust (`rfd::FileDialog::save_file`):** elección nativa de carpeta y nombre en Windows, macOS y Linux con verificación de firma `%PDF`, anexado seguro de extensión `.pdf` y acción directa **«Abrir PDF»** sobre el documento generado.
            - **Reordenación por arrastre de miniaturas y atajos rápidos de teclado:** arrastrar y soltar hojas en la columna de miniaturas + atajos de productividad (`←` / `→` navegar hojas, `R` rotar `+90°`, `Delete` excluir/restaurar hoja, `Ctrl+S` / `Cmd+S` exportar PDF).
            - **Modo Claro / Oscuro nativo + Ventana amplia centrada (`1280×820`):** conmutador instantáneo de tema en la barra superior sincronizado con tokens semánticos de Atomic UI (`data-theme` + `localStorage` + `prefers-color-scheme`) y `Content-Security-Policy` explícita en Tauri v1.5.

            ### 📦 Ejecutables y Paquetes Compilados por Sistema Operativo (Origen, Ubicación y Extensión)

            Cada artefacto es generado automáticamente por este pipeline CI/CD tras aprobar el job `verificar-compuertas` (candado `tauri.conf.json`, gobernanza, tipado estricto, reglas de tema/CSS, 330+ pruebas Vitest y `cargo test`), compilando primero el frontend Angular (`frontend/dist/pdf-tool/browser`), incrustándolo en el binario nativo mediante `cargo build --release` y empaquetándolo con la extensión estándar de cada sistema operativo:

            | Plataforma / Arquitectura | Artefacto Publicado en este Release | Ruta de Origen del Compilador (`Cargo + Tauri`) | Formato Nativo, Extensión y Ejecución |
            | :--- | :--- | :--- | :--- |
            | **Windows (`x86_64`)** | `union-pdf-windows-x86_64.exe` (+ `.sha256`) | `src-tauri/target/release/union-pdf.exe` | **Ejecutable nativo PE64 (`.exe`)** con iconos multirresolución y frontend embebido. Ejecución directa en Windows. |
            | **macOS Apple Silicon (`arm64` · M1/M2/M3/M4)** | `union-pdf-macos-arm64.app.tar.gz` (+ `.sha256`) | `src-tauri/target/aarch64-apple-darwin/release/union-pdf` → `union-pdf.app` | **Application Bundle nativo de macOS (`union-pdf.app` Mach-O 64-bit) empaquetado en `.app.tar.gz`** con `Info.plist`, icono `icon.icns`, firma ad-hoc y frontend embebido. Descomprimir con doble clic (o `tar -xzf union-pdf-macos-arm64.app.tar.gz`) y abrir `union-pdf.app`. |
            | **macOS Intel (`x86_64`)** | `union-pdf-macos-x86_64.app.tar.gz` (+ `.sha256`) | `src-tauri/target/x86_64-apple-darwin/release/union-pdf` → `union-pdf.app` | **Application Bundle nativo de macOS (`union-pdf.app` Mach-O 64-bit) empaquetado en `.app.tar.gz`** con `Info.plist`, icono `icon.icns`, firma ad-hoc y frontend embebido. Descomprimir con doble clic (o `tar -xzf union-pdf-macos-x86_64.app.tar.gz`) y abrir `union-pdf.app`. |
            | **Linux (`x86_64`)** | `union-pdf-linux-x86_64.tar.gz` (+ `.sha256`) | `src-tauri/target/release/union-pdf` → `union-pdf` | **Archivo comprimido `.tar.gz` con el ejecutable nativo autónomo ELF 64-bit (`union-pdf`)** y permisos `+x` (`0755`) preservados, enlazado a GTK3/WebKit2GTK y con frontend embebido. Extraer y ejecutar con `tar -xzf union-pdf-linux-x86_64.tar.gz && ./union-pdf`. |

            > **Nota técnica sobre el empaquetado multiplataforma:** En Windows se publica el binario portable PE64 con extensión `.exe`; en macOS (`arm64` y `x86_64`) el binario Mach-O compilado por Cargo se ensambla dentro del paquete de aplicación estándar `union-pdf.app` (`Contents/MacOS/union-pdf`, `Contents/Info.plist`, `Contents/Resources/icon.icns`) y se distribuye comprimido con extensión `.app.tar.gz`; y en Linux el binario ELF se distribuye empaquetado con extensión `.tar.gz` conservando los permisos de ejecución UNIX (`0755`).
          draft: false
          prerelease: false
          files: |
            release-portables/${{ matrix.binario_publico }}
            release-portables/${{ matrix.binario_publico }}.sha256
