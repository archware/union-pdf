name: Release Multiplataforma (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag de version para publicar en GitHub Releases (ej. v0.5.4)'
        required: false
        default: 'v0.5.4'

permissions:
  contents: write

jobs:
  verificar-compuertas:
    name: Compuertas de Calidad (Frontend + Rust)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias nativas de Linux (GTK3 / WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Verificar integridad de tauri.conf.json y gobernanza
        run: |
          node scripts/verificar-tauri-conf.mjs
          npm run test:gobernanza

      - name: Instalar dependencias y verificar Frontend (Atomic UI + Vitest + Build)
        working-directory: frontend
        run: |
          npm ci
          if [ -d "../../-Atomic-UI" ]; then
            npm run check:atomic:pin
          else
            echo "Checkout aislado en CI: se omite check:atomic:pin (requiere clon hermano ../../-Atomic-UI)"
          fi
          npm run check:types
          npm run check:angular
          npm run check:theme
          npm run check:css
          npm test -- --watch=false
          npm run build

      - name: Ejecutar pruebas unitarias de Backend Rust
        working-directory: src-tauri
        run: cargo test

  publicar-release:
    name: Compilar y Publicar (${{ matrix.etiqueta }})
    needs: verificar-compuertas
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            etiqueta: windows-x86_64
            args: ''
            binario_origen: src-tauri/target/release/union-pdf.exe
            binario_publico: union-pdf-windows-x86_64.exe
          - os: ubuntu-22.04
            etiqueta: linux-x86_64
            args: ''
            binario_origen: src-tauri/target/release/union-pdf
            binario_publico: union-pdf-linux-x86_64.tar.gz
          - os: macos-latest
            etiqueta: macos-aarch64
            args: '--target aarch64-apple-darwin'
            binario_origen: src-tauri/target/aarch64-apple-darwin/release/union-pdf
            binario_publico: union-pdf-macos-arm64.app.tar.gz
          - os: macos-latest
            etiqueta: macos-x86_64
            args: '--target x86_64-apple-darwin'
            binario_origen: src-tauri/target/x86_64-apple-darwin/release/union-pdf
            binario_publico: union-pdf-macos-x86_64.app.tar.gz

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema en Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Instalar dependencias de Frontend y compilar dist/
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compilar binario nativo Release (Cargo + Tauri v1.5)
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml ${{ matrix.args }}

      - name: Empaquetar artefacto por plataforma (.exe, .app.tar.gz, .tar.gz) con checksum SHA-256
        shell: bash
        run: |
          mkdir -p release-portables
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "${{ matrix.binario_origen }}" "release-portables/${{ matrix.binario_publico }}"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            APP_DIR="build-bundle/union-pdf.app"
            rm -rf build-bundle
            mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
            cp "${{ matrix.binario_origen }}" "$APP_DIR/Contents/MacOS/union-pdf"
            chmod 755 "$APP_DIR/Contents/MacOS/union-pdf"
            cp "src-tauri/icons/icon.icns" "$APP_DIR/Contents/Resources/icon.icns"
            printf 'APPL????' > "$APP_DIR/Contents/PkgInfo"
            node -e '
              const fs = require("fs");
              const pkg = require("./src-tauri/tauri.conf.json").package;
              const plist = [
                "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
                "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">",
                "<plist version=\"1.0\">",
                "<dict>",
                "  <key>CFBundleDevelopmentRegion</key>",
                "  <string>es</string>",
                "  <key>CFBundleDisplayName</key>",
                "  <string>Unión PDF</string>",
                "  <key>CFBundleExecutable</key>",
                "  <string>union-pdf</string>",
                "  <key>CFBundleIconFile</key>",
                "  <string>icon.icns</string>",
                "  <key>CFBundleIdentifier</key>",
                "  <string>com.archware.union-pdf</string>",
                "  <key>CFBundleInfoDictionaryVersion</key>",
                "  <string>6.0</string>",
                "  <key>CFBundleName</key>",
                "  <string>union-pdf</string>",
                "  <key>CFBundlePackageType</key>",
                "  <string>APPL</string>",
                "  <key>CFBundleShortVersionString</key>",
                "  <string>" + pkg.version + "</string>",
                "  <key>CFBundleVersion</key>",
                "  <string>" + pkg.version + "</string>",
                "  <key>LSMinimumSystemVersion</key>",
                "  <string>10.13</string>",
                "  <key>NSHighResolutionCapable</key>",
                "  <true/>",
                "</dict>",
                "</plist>",
                ""
              ].join("\n");
              fs.writeFileSync("build-bundle/union-pdf.app/Contents/Info.plist", plist, "utf8");
            '
            plutil -lint "$APP_DIR/Contents/Info.plist"
            codesign --force --deep --sign - "$APP_DIR"
            COPYFILE_DISABLE=1 tar -C build-bundle -czf "release-portables/${{ matrix.binario_publico }}" union-pdf.app
          else
            rm -rf build-bundle
            mkdir -p build-bundle
            cp "${{ matrix.binario_origen }}" "build-bundle/payload"
            cat << 'EOF' > "build-bundle/launcher.c"
            #define _GNU_SOURCE
            #include <stdio.h>
            #include <stdlib.h>
            #include <stdint.h>
            #include <string.h>
            #include <unistd.h>
            #include <sys/stat.h>
            #include <sys/types.h>
            #include <fcntl.h>
            #include <errno.h>

            extern const unsigned char _binary_payload_start[];
            extern const unsigned char _binary_payload_end[];

            static const char *SEARCH_DIRS[] = {
                "/usr/lib/x86_64-linux-gnu",
                "/lib/x86_64-linux-gnu",
                "/usr/lib64",
                "/lib64",
                "/usr/lib",
                "/lib",
                "/usr/local/lib64",
                "/usr/local/lib",
                NULL
            };

            static int fmt_ok(int n, size_t cap) {
                return n > 0 && (size_t)n < cap;
            }

            static int find_lib(const char *name, const char *orig_ld, char *out, size_t out_sz) {
                if (orig_ld && orig_ld[0]) {
                    const char *p = orig_ld;
                    while (*p) {
                        const char *colon = strchr(p, ':');
                        size_t dlen = colon ? (size_t)(colon - p) : strlen(p);
                        if (dlen > 0 && dlen + 1 + strlen(name) < out_sz) {
                            memcpy(out, p, dlen);
                            out[dlen] = '/';
                            strcpy(out + dlen + 1, name);
                            if (access(out, R_OK) == 0) return 1;
                        }
                        if (!colon) break;
                        p = colon + 1;
                    }
                }
                for (int i = 0; SEARCH_DIRS[i]; i++) {
                    if (fmt_ok(snprintf(out, out_sz, "%s/%s", SEARCH_DIRS[i], name), out_sz) &&
                        access(out, R_OK) == 0) {
                        return 1;
                    }
                }
                return 0;
            }

            static int ensure_owned_dir(const char *path) {
                if (mkdir(path, 0700) != 0 && errno != EEXIST) {
                    return 0;
                }
                struct stat st;
                if (lstat(path, &st) != 0) return 0;
                if (!S_ISDIR(st.st_mode)) return 0;
                if (st.st_uid != getuid()) return 0;
                return 1;
            }

            static int replace_symlink(const char *target, const char *link_path) {
                unlink(link_path);
                return symlink(target, link_path) == 0;
            }

            /* Selecciona de forma atomica la familia ABI completa (4.0 o 4.1) para impedir
               que libsoup-2.4.so.1 y libsoup-3.0.so.0 se carguen simultaneamente en el mismo
               proceso cuando ambos paquetes coexisten en Ubuntu 24.04+ / Debian 13+ / Fedora 40+. */
            static int configure_webkit_runtime_libs(
                const char *lib_dir,
                const char *orig_ld,
                int *warned_missing_libs
            ) {
                char wk40[1024], jsc40[1024], soup24[1024];
                char wk41[1024], jsc41[1024], soup30[1024];
                char link_wk[1024], link_jsc[1024], link_soup[1024];

                if (!fmt_ok(snprintf(link_wk, sizeof(link_wk), "%s/libwebkit2gtk-4.0.so.37", lib_dir), sizeof(link_wk)) ||
                    !fmt_ok(snprintf(link_jsc, sizeof(link_jsc), "%s/libjavascriptcoregtk-4.0.so.18", lib_dir), sizeof(link_jsc)) ||
                    !fmt_ok(snprintf(link_soup, sizeof(link_soup), "%s/libsoup-2.4.so.1", lib_dir), sizeof(link_soup))) {
                    return 0;
                }

                int has_family_40 =
                    find_lib("libwebkit2gtk-4.0.so.37", orig_ld, wk40, sizeof(wk40)) &&
                    find_lib("libjavascriptcoregtk-4.0.so.18", orig_ld, jsc40, sizeof(jsc40)) &&
                    find_lib("libsoup-2.4.so.1", orig_ld, soup24, sizeof(soup24));

                if (has_family_40) {
                    unlink(link_wk);
                    unlink(link_jsc);
                    unlink(link_soup);
                    if (orig_ld && orig_ld[0]) {
                        setenv("LD_LIBRARY_PATH", orig_ld, 1);
                    } else {
                        unsetenv("LD_LIBRARY_PATH");
                    }
                    unsetenv("UNION_PDF_SHIM_LD");
                    unsetenv("UNION_PDF_ORIG_LD_LIBRARY_PATH");
                    return 1;
                }

                int has_family_41 =
                    find_lib("libwebkit2gtk-4.1.so.0", orig_ld, wk41, sizeof(wk41)) &&
                    find_lib("libjavascriptcoregtk-4.1.so.0", orig_ld, jsc41, sizeof(jsc41)) &&
                    find_lib("libsoup-3.0.so.0", orig_ld, soup30, sizeof(soup30));

                if (has_family_41) {
                    if (!replace_symlink(wk41, link_wk) ||
                        !replace_symlink(jsc41, link_jsc) ||
                        !replace_symlink(soup30, link_soup)) {
                        return 0;
                    }
                    char new_ld[2560];
                    if (orig_ld && orig_ld[0]) {
                        if (!fmt_ok(snprintf(new_ld, sizeof(new_ld), "%s:%s", lib_dir, orig_ld), sizeof(new_ld))) {
                            return 0;
                        }
                        setenv("UNION_PDF_ORIG_LD_LIBRARY_PATH", orig_ld, 1);
                    } else {
                        if (!fmt_ok(snprintf(new_ld, sizeof(new_ld), "%s", lib_dir), sizeof(new_ld))) {
                            return 0;
                        }
                        setenv("UNION_PDF_ORIG_LD_LIBRARY_PATH", "", 1);
                    }
                    setenv("UNION_PDF_SHIM_LD", "1", 1);
                    setenv("LD_LIBRARY_PATH", new_ld, 1);
                    return 2;
                }

                if (!(*warned_missing_libs)) {
                    *warned_missing_libs = 1;
                    fprintf(stderr,
                        "Unión PDF: faltan las bibliotecas de WebKit2GTK en el sistema.\n"
                        "Instálelas ejecutando en su terminal:\n"
                        "  Ubuntu 24.04+ / Debian 13+: sudo apt install -y libwebkit2gtk-4.1-0 libgtk-3-0\n"
                        "  Ubuntu 22.04 / Debian 12:   sudo apt install -y libwebkit2gtk-4.0-37 libgtk-3-0\n"
                        "  Fedora 40+ / RHEL 9+:       sudo dnf install -y webkit2gtk4.1 gtk3\n"
                        "  Arch Linux / Manjaro:       sudo pacman -S webkit2gtk-4.1 gtk3\n");
                }
                return 0;
            }

            static uint64_t fnv1a64(const unsigned char *buf, size_t len) {
                uint64_t h = 14695981039346656037ULL;
                size_t step = len > 65536 ? (len / 16384) : 1;
                for (size_t i = 0; i < len; i += step) {
                    h ^= (uint64_t)buf[i];
                    h *= 1099511628211ULL;
                }
                h ^= (uint64_t)len;
                h *= 1099511628211ULL;
                return h;
            }

            static int try_launch_in_base(
                const char *base_dir,
                const char *orig_ld,
                uint64_t digest,
                size_t payload_size,
                char **argv,
                int *warned_missing_libs
            ) {
                if (!base_dir || base_dir[0] != '/') return -1;

                char runtime_dir[512];
                char lib_dir[560];
                char core_path[640];
                if (!fmt_ok(snprintf(runtime_dir, sizeof(runtime_dir), "%s/.union-pdf-rt-%u",
                                     base_dir, (unsigned)getuid()), sizeof(runtime_dir)) ||
                    !fmt_ok(snprintf(lib_dir, sizeof(lib_dir), "%s/lib", runtime_dir), sizeof(lib_dir))) {
                    return -1;
                }

                if (!ensure_owned_dir(runtime_dir) || !ensure_owned_dir(lib_dir)) {
                    return -1;
                }

                configure_webkit_runtime_libs(lib_dir, orig_ld, warned_missing_libs);

                if (!fmt_ok(snprintf(core_path, sizeof(core_path), "%s/union-pdf-core-%016llx",
                                     runtime_dir, (unsigned long long)digest), sizeof(core_path))) {
                    return -1;
                }

                struct stat st;
                if (lstat(core_path, &st) != 0 || !S_ISREG(st.st_mode) ||
                    (size_t)st.st_size != payload_size) {
                    char tmp_path[700];
                    if (!fmt_ok(snprintf(tmp_path, sizeof(tmp_path), "%s.tmp.%d",
                                         core_path, (int)getpid()), sizeof(tmp_path))) {
                        return -1;
                    }
                    unlink(tmp_path);
                    int fd = open(tmp_path, O_WRONLY | O_CREAT | O_EXCL, 0755);
                    if (fd < 0) {
                        return -1;
                    }
                    size_t written = 0;
                    while (written < payload_size) {
                        ssize_t n = write(fd, _binary_payload_start + written, payload_size - written);
                        if (n <= 0) {
                            if (errno == EINTR) continue;
                            close(fd);
                            unlink(tmp_path);
                            return -1;
                        }
                        written += (size_t)n;
                    }
                    close(fd);
                    chmod(tmp_path, 0755);
                    if (rename(tmp_path, core_path) != 0) {
                        unlink(tmp_path);
                        return -1;
                    }
                } else {
                    chmod(core_path, 0755);
                }

                execv(core_path, argv);
                int saved_errno = errno;
                if (saved_errno == EACCES || saved_errno == EPERM) {
                    /* Si el punto de montaje (ej. /tmp con noexec) rechaza execv, limpia el binario
                       extraido en esta ruta y permite el fallback a $XDG_CACHE_HOME / $HOME/.cache. */
                    unlink(core_path);
                }
                errno = saved_errno;
                return -1;
            }

            int main(int argc, char **argv) {
                (void)argc;
                if (!getenv("WEBKIT_DISABLE_DMABUF_RENDERER")) {
                    setenv("WEBKIT_DISABLE_DMABUF_RENDERER", "1", 1);
                }

                const char *raw_ld = getenv("LD_LIBRARY_PATH");
                char orig_ld[1536];
                orig_ld[0] = '\0';
                if (raw_ld && raw_ld[0]) {
                    if (!fmt_ok(snprintf(orig_ld, sizeof(orig_ld), "%s", raw_ld), sizeof(orig_ld))) {
                        orig_ld[0] = '\0';
                    }
                }

                size_t payload_size = (size_t)(_binary_payload_end - _binary_payload_start);
                uint64_t digest = fnv1a64(_binary_payload_start, payload_size);
                int warned_missing_libs = 0;

                /* 1. Intentar primero en /tmp (tmpfs en RAM). */
                try_launch_in_base("/tmp", orig_ld, digest, payload_size, argv, &warned_missing_libs);

                /* 2. Fallback para sistemas con /tmp montado como noexec: $XDG_CACHE_HOME. */
                const char *xdg_cache = getenv("XDG_CACHE_HOME");
                if (xdg_cache && xdg_cache[0] == '/') {
                    ensure_owned_dir(xdg_cache);
                    try_launch_in_base(xdg_cache, orig_ld, digest, payload_size, argv, &warned_missing_libs);
                }

                /* 3. Fallback a $HOME/.cache. */
                const char *home = getenv("HOME");
                if (home && home[0] == '/') {
                    char home_cache[512];
                    if (fmt_ok(snprintf(home_cache, sizeof(home_cache), "%s/.cache", home), sizeof(home_cache))) {
                        ensure_owned_dir(home_cache);
                        try_launch_in_base(home_cache, orig_ld, digest, payload_size, argv, &warned_missing_libs);
                    }
                }

                /* 4. Ultimo respaldo en /var/tmp. */
                try_launch_in_base("/var/tmp", orig_ld, digest, payload_size, argv, &warned_missing_libs);

                perror("union-pdf: execv");
                return 1;
            }
            EOF
            (
              cd build-bundle
              ld -r -b binary -o payload.o payload
              objcopy --rename-section .data=.rodata,alloc,load,readonly,data,contents payload.o payload.o
              gcc -Wall -Wextra -O2 -no-pie -Wl,-z,noexecstack -o union-pdf launcher.c payload.o
              strip --strip-unneeded union-pdf
              rm -f payload payload.o launcher.c
            )
            chmod 755 "build-bundle/union-pdf"
            readelf -h "build-bundle/union-pdf" | grep -E "Type:[[:space:]]+EXEC"
            tar -C build-bundle -czf "release-portables/${{ matrix.binario_publico }}" union-pdf
          fi
          cd release-portables
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.binario_publico }}" > "${{ matrix.binario_publico }}.sha256"
          else
            shasum -a 256 "${{ matrix.binario_publico }}" > "${{ matrix.binario_publico }}.sha256"
          fi

      - name: Publicar artefactos multiplataforma en GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_version || 'v0.5.4' }}
          name: "Unión PDF ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_version || 'v0.5.4' }}"
          body: |
            ## Unión PDF — Lanzamiento Corporativo Multiplataforma (`COTAHA · @archware`)

            Aplicación corporativa de escritorio diseñada para demostrar que la integración entre el ecosistema propio de Backend (**Artifact Mangosta** — DDD, Arquitectura Hexagonal, CQRS estricto y frontera IPC determinista `DesktopFacadeService` + `RespuestaSistemaV1<T>`) y el ecosistema propio de Frontend (**Artifact Barracuda** + **Atomic UI `@atomic-ui/core v5.22.0`** sobre Angular 22 + Signals) genera software nativo de calidad empresarial, 100% en memoria local y auditado por compuertas deterministas.

            ### 📦 Ejecutables y Paquetes Compilados por Sistema Operativo (Origen, Ubicación y Extensión)

            Cada artefacto es generado automáticamente por este pipeline CI/CD tras aprobar el job `verificar-compuertas` (candado `tauri.conf.json`, gobernanza, tipado estricto, reglas de tema/CSS, 325+ pruebas Vitest y `cargo test`), compilando primero el frontend Angular (`frontend/dist/pdf-tool/browser`), incrustándolo en el binario nativo mediante `cargo build --release` y empaquetándolo con la extensión estándar de cada sistema operativo:

            | Plataforma / Arquitectura | Artefacto Publicado en este Release | Ruta de Origen del Compilador (`Cargo + Tauri`) | Formato Nativo, Extensión y Ejecución |
            | :--- | :--- | :--- | :--- |
            | **Windows (`x86_64`)** | `union-pdf-windows-x86_64.exe` (+ `.sha256`) | `src-tauri/target/release/union-pdf.exe` | **Ejecutable nativo PE64 (`.exe`)** con iconos multirresolución y frontend embebido. Ejecución directa en Windows. |
            | **macOS Apple Silicon (`arm64` · M1/M2/M3/M4)** | `union-pdf-macos-arm64.app.tar.gz` (+ `.sha256`) | `src-tauri/target/aarch64-apple-darwin/release/union-pdf` → `union-pdf.app` | **Application Bundle nativo de macOS (`union-pdf.app` Mach-O 64-bit) empaquetado en `.app.tar.gz`** con `Info.plist`, icono `icon.icns`, firma ad-hoc y frontend embebido. Descomprimir con doble clic (o `tar -xzf union-pdf-macos-arm64.app.tar.gz`) y abrir `union-pdf.app`. |
            | **macOS Intel (`x86_64`)** | `union-pdf-macos-x86_64.app.tar.gz` (+ `.sha256`) | `src-tauri/target/x86_64-apple-darwin/release/union-pdf` → `union-pdf.app` | **Application Bundle nativo de macOS (`union-pdf.app` Mach-O 64-bit) empaquetado en `.app.tar.gz`** con `Info.plist`, icono `icon.icns`, firma ad-hoc y frontend embebido. Descomprimir con doble clic (o `tar -xzf union-pdf-macos-x86_64.app.tar.gz`) y abrir `union-pdf.app`. |
            | **Linux (`x86_64`)** | `union-pdf-linux-x86_64.tar.gz` (+ `.sha256`) | `src-tauri/target/release/union-pdf` → `union-pdf` | **Archivo comprimido `.tar.gz` con el ejecutable nativo autónomo ELF 64-bit (`union-pdf`)** y permisos `+x` (`0755`) preservados, enlazado a GTK3/WebKit2GTK y con frontend embebido. Extraer y ejecutar con `tar -xzf union-pdf-linux-x86_64.tar.gz && ./union-pdf`. |

            > **Nota técnica sobre el empaquetado multiplataforma:** En Windows se publica el binario portable PE64 con extensión `.exe`; en macOS (`arm64` y `x86_64`) el binario Mach-O compilado por Cargo se ensambla dentro del paquete de aplicación estándar `union-pdf.app` (`Contents/MacOS/union-pdf`, `Contents/Info.plist`, `Contents/Resources/icon.icns`) y se distribuye comprimido con extensión `.app.tar.gz`; y en Linux el binario ELF se distribuye empaquetado con extensión `.tar.gz` conservando los permisos de ejecución UNIX (`0755`).
          draft: false
          prerelease: false
          files: |
            release-portables/${{ matrix.binario_publico }}
            release-portables/${{ matrix.binario_publico }}.sha256
